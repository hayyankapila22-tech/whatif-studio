<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:IDB;src:url(InterDisplay-Black.otf)}
@font-face{font-family:IDBo;src:url(InterDisplay-Bold.otf)}
@font-face{font-family:IM;src:url(Inter-Medium.otf)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#05070f}
canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
#ui{position:absolute;inset:0;pointer-events:none;font-family:IDB}
#bar{position:absolute;left:60px;right:60px;top:118px;display:flex;justify-content:space-between;align-items:center;font-size:40px;color:#ffc444;letter-spacing:1px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
#bar span:last-child{color:#a9b2d6;font-family:IDBo;font-size:34px}
#track{position:absolute;left:60px;right:60px;top:180px;height:10px;border-radius:5px;background:rgba(255,255,255,.18)}
#fill{height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#ffb020,#ffd76a);box-shadow:0 0 14px rgba(255,196,68,.8)}
.cap{position:absolute;left:40px;right:40px;text-align:center;line-height:1.08}
.w{display:inline-block;margin:0 .13em;color:#fff;-webkit-text-stroke:6px #0a0b18;paint-order:stroke fill;text-shadow:0 6px 24px rgba(0,0,0,.55)}
.g{color:#ffc444}.r{color:#ff5468}.c{color:#5ee0ff}
#small{position:absolute;left:0;right:0;text-align:center;font-family:IM;color:#a9b2d6;font-size:34px}
#black{position:absolute;inset:0;background:#000;opacity:0}
#nosig{position:absolute;left:0;right:0;top:880px;text-align:center;font-family:monospace;font-weight:bold;font-size:120px;color:#e8e8f0;opacity:0;text-shadow:0 0 30px rgba(255,255,255,.5)}
#scan{position:absolute;inset:0;opacity:0;background:repeating-linear-gradient(0deg,rgba(255,0,60,.12) 0 3px,transparent 3px 9px)}
</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<div id="ui">
  <div id="scan"></div>
  <div id="black"></div>
  <div id="nosig">NO SIGNAL</div>
  <div id="bar"><span>WHAT IF (x)?</span><span>EP. 1</span></div>
  <div id="track"><div id="fill"></div></div>
  <div id="caps"></div>
  <div id="small"></div>
</div>
<script type="module" src="scene.js"></script>
</body></html>
